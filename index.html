<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>散歩ルートアプリ</title>
</head>
<body>
  <h1>🚶‍♀️ 散歩ルートアプリ</h1>
  <p>現在地から散歩ルートを作るアプリ</p>

  <label>
    散歩時間（分）：
    <input type="number" value="30" min="30" step="10" />
  </label>

  <br /><br />
  <button>ルートを作る</button>

<script>
  const button = document.getElementById("makeRoute");

  button.addEventListener("click", () => {
    if (!navigator.geolocation) {
      alert("この端末では現在地が取得できません");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        alert(`現在地を取得しました！\n緯度: ${lat}\n経度: ${lng}`);
      },
      () => {
        alert("位置情報の取得が許可されていません");
      }
    );
  });
</script>
  
  <p style="margin-top:20px; color:gray;">
    ※ まだ地図は出ません（次でやる）
  </p>
</body>
</html>
