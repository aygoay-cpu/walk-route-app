<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="散歩ルート">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>散歩ルートアプリ</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f7f7f7;
  }

  h1 {
    text-align: center;
    margin-bottom: 8px;
  }

  button {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    background: #34c759;
    color: white;
    border: none;
    border-radius: 12px;
    margin-top: 12px;
  }

  button:active {
    opacity: 0.8;
  }

  input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 6px;
  }

  #map {
    height: 50vh;
    margin-top: 12px;
    border-radius: 12px;
    overflow: hidden;
  }
</style>
</head>

<body>
  <h1>🚶‍♀️ 散歩ルートアプリ</h1>
  <p>現在地から散歩ルートを作ります</p>

  <label>
    散歩時間（分）：
    <input id="walkTime" type="number" value="30" min="30" step="10" />
  </label>

  <br /><br />

  <button id="makeRoute">ルートを作る</button>

  <div id="map"></div>

  <script>
    // ==============================
    // 設定
    // ==============================
    const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImY5ZDRiMDg1N2VkYTQyNjRhODUzMzk0NGY3MWNlNDg1IiwiaCI6Im11cm11cjY0In0=";  

    let marker;
    let routeLine;

    // ==============================
    // 地図初期化
    // ==============================
    const map = L.map("map").setView([35.681236, 139.767125], 15);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    const button = document.getElementById("makeRoute");

    // ==============================
    // ボタン処理
    // ==============================
    button.addEventListener("click", () => {
      button.textContent = "現在地を取得中…";

      if (!navigator.geolocation) {
        alert("この端末では現在地が取得できません");
        button.textContent = "ルートを作る";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          // 地図移動
          map.setView([lat, lng], 16);

          // ピン
          if (marker) {
            marker.setLatLng([lat, lng]);
          } else {
            marker = L.marker([lat, lng]).addTo(map);
          }

          // ==============================
          // ルート用ランダムポイント生成
          // ==============================
          const minutes = Number(document.getElementById("walkTime").value);
          const totalDistance = minutes * 80; // 1分80m
          const segment = totalDistance / 4;

          const points = [];
          let currentLat = lat;
          let currentLng = lng;

          points.push([lat, lng]);

          for (let i = 0; i < 3; i++) {
            const angle = Math.random() * 2 * Math.PI;
            const dx = (segment * Math.cos(angle)) / 111000;
            const dy = (segment * Math.sin(angle)) / 111000;

            currentLat += dy;
            currentLng += dx;
            points.push([currentLat, currentLng]);
          }

          // スタートに戻る
          points.push([lat, lng]);

          // ==============================
          // ORSに送信
          // ==============================
          fetch(
            "https://api.openrouteservice.org/v2/directions/foot-walking/geojson",
            {
              method: "POST",
              headers: {
                Authorization: ORS_API_KEY,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                coordinates: points.map((p) => [p[1], p[0]]), // lng, lat
              }),
            }
          )
            .then((res) => res.json())
            .then((data) => {
              if (routeLine) {
                map.removeLayer(routeLine);
              }

              routeLine = L.geoJSON(data, {
                style: {
                  color: "blue",
                  weight: 4,
                },
              }).addTo(map);
            })
            .catch(() => {
              alert("ルート取得に失敗しました");
            });

          button.textContent = "ルートを作る";
        },
        () => {
          alert("位置情報の取得が許可されていません");
          button.textContent = "ルートを作る";
        }
      );
    });
  </script>
</body>
</html>
