<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>散歩ルートアプリ</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <h1>🚶‍♀️ 散歩ルートアプリ</h1>
  <p>現在地から散歩ルートを作るアプリ</p>

  <label>
    散歩時間（分）：
    <input type="number" value="30" min="30" step="10" />
  </label>

  <br /><br />

  <div id="map" style="height: 300px; margin-bottom: 20px;"></div>

  <button id="makeRoute">ルートを作る</button>

  <p style="margin-top:20px; color:gray;">
    ※ 現在地を地図に表示します
  </p>

  <script>
    // 地図を初期化（仮で東京駅）
    const map = L.map("map").setView([35.681236, 139.767125], 15);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    let marker;

    const button = document.getElementById("makeRoute");

    button.addEventListener("click", () => {
  button.textContent = "現在地を取得中…";

  if (!navigator.geolocation) {
    alert("この端末では現在地が取得できません");
    button.textContent = "ルートを作る";
    return;
  }

  navigator.geolocation.getCurrentPosition(
        (position) => {
  const lat = position.coords.latitude;
  const lng = position.coords.longitude;

  map.setView([lat, lng], 16);

  if (marker) {
    marker.setLatLng([lat, lng]);
  } else {
    marker = L.marker([lat, lng]).addTo(map);
  }

  button.textContent = "ルートを作る";
},
        () => {
  alert("位置情報の取得が許可されていません");
  button.textContent = "ルートを作る";
}
      );
    });
  </script>
</body>
</html>
