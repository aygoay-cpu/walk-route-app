<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>散歩ルートアプリ</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <h1>🚶‍♀️ 散歩ルートアプリ</h1>
  <p>現在地から散歩ルートを作るアプリ</p>

  <label>
    散歩時間（分）：
    <input id="walkTime" type="number" value="30" min="30" step="10" />
  </label>

  <br /><br />

  <div id="map" style="height: 300px; margin-bottom: 20px;"></div>

  <button id="makeRoute">ルートを作る</button>

  <p style="margin-top:20px; color:gray;">
    ※ 現在地を地図に表示します
  </p>

  <script>
    // 地図を初期化（仮で東京駅）
    const map = L.map("map").setView([35.681236, 139.767125], 15);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    let marker;
let walkCircle;
let routeLine;
    
    const button = document.getElementById("makeRoute");

    button.addEventListener("click", () => {
  button.textContent = "現在地を取得中…";

  if (!navigator.geolocation) {
    alert("この端末では現在地が取得できません");
    button.textContent = "ルートを作る";
    return;
  }

  navigator.geolocation.getCurrentPosition(
        (position) => {
  const lat = position.coords.latitude;
  const lng = position.coords.longitude;

  map.setView([lat, lng], 16);

  // ピン
  if (marker) {
    marker.setLatLng([lat, lng]);
  } else {
    marker = L.marker([lat, lng]).addTo(map);
  }

  // 散歩時間
  const minutes = Number(document.getElementById("walkTime").value);
  const totalDistance = minutes * 80;

  // 4分割
  const segment = totalDistance / 4;

  const points = [];
  let currentLat = lat;
  let currentLng = lng;

  points.push([currentLat, currentLng]);

  for (let i = 0; i < 3; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const dx = (segment * Math.cos(angle)) / 111000;
    const dy = (segment * Math.sin(angle)) / 111000;

    currentLat += dy;
    currentLng += dx;

    points.push([currentLat, currentLng]);
  }

  // 最後はスタートに戻る
  points.push([lat, lng]);

  // 既存ルート削除
  if (routeLine) {
    map.removeLayer(routeLine);
  }

  routeLine = L.polyline(points, {
    color: "blue",
    weight: 4,
  }).addTo(map);

  button.textContent = "ルートを作る";
},
      );
    });
  </script>
</body>
</html>
